{% extends "base.html" %}

{% block title %}Enterprise Core | Secure Sign In{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        
        <!-- Header Banner -->
        <div class="text-center">
            <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-xl shadow-indigo-600/30 mb-4 glow-indigo">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-100 tracking-tight">Enterprise Portal</h2>
            <p class="mt-2 text-sm text-slate-400">Sign in with your organizational credentials</p>
        </div>

        <!-- Glassmorphism Login Card -->
        <div class="glass-panel rounded-3xl p-8 shadow-2xl border border-slate-800 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-violet-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <form id="login-form" class="space-y-5 relative">
                <!-- Username Input -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Username
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input 
                            id="username" 
                            name="username" 
                            type="text" 
                            required 
                            placeholder="e.g. admin or sarah.jenkins"
                            class="block w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-medium"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                            Password
                        </label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required 
                            placeholder="••••••••"
                            class="block w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-medium"
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    id="submit-btn" 
                    type="submit" 
                    class="w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer">
                    <span>Authenticate Account</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"></i>
                </button>
            </form>

            <!-- Quick Access Test Credentials -->
            <div class="mt-8 pt-6 border-t border-slate-800/80">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 text-center">
                    Quick Access Demo Accounts
                </p>
                <div class="grid grid-cols-1 gap-2">
                    <button 
                        type="button" 
                        onclick="fillCredentials('admin', 'admin123')" 
                        class="px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-indigo-950/40 border border-slate-800 hover:border-indigo-500/40 text-left transition-all flex items-center justify-between group">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                            <span class="text-xs font-medium text-slate-200">Administrator Role</span>
                        </div>
                        <span class="text-[11px] text-slate-400 font-mono group-hover:text-indigo-300">admin / admin123</span>
                    </button>

                    <button 
                        type="button" 
                        onclick="fillCredentials('sarah.jenkins', 'emp123')" 
                        class="px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-emerald-950/40 border border-slate-800 hover:border-emerald-500/40 text-left transition-all flex items-center justify-between group">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span class="text-xs font-medium text-slate-200">Sarah Jenkins (Staff)</span>
                        </div>
                        <span class="text-[11px] text-slate-400 font-mono group-hover:text-emerald-300">sarah.jenkins / emp123</span>
                    </button>

                    <button 
                        type="button" 
                        onclick="fillCredentials('marcus.chen', 'emp123')" 
                        class="px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-emerald-950/40 border border-slate-800 hover:border-emerald-500/40 text-left transition-all flex items-center justify-between group">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span class="text-xs font-medium text-slate-200">Marcus Chen (Staff)</span>
                        </div>
                        <span class="text-[11px] text-slate-400 font-mono group-hover:text-emerald-300">marcus.chen / emp123</span>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function fillCredentials(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
        showToast(`Credentials populated for @${user}`, 'info', 2000);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            showToast('Please enter both username and password.', 'warning');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="inline-block animate-spin mr-2">⟳</span> Authenticating...';

        const res = await apiFetch('/api/auth/login', {
            method: 'POST',
            body: { username, password }
        });

        if (res.success) {
            showToast(res.message, 'success');
            setTimeout(() => {
                window.location.href = res.data?.redirect_url || '/';
            }, 600);
        } else {
            showToast(res.message || 'Authentication failed. Please check credentials.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<span>Authenticate Account</span><i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>';
            if (window.lucide) lucide.createIcons();
        }
    });
</script>
{% endblock %}
